version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: healthplus_backend
    restart: always
    environment:
      DATABASE_URL: sqlite:////app/data/healthplus.db
      SECRET_KEY: super-secret-healthplus-jwt-key-2026-production-ready
    volumes:
      - sqlite_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthplus_frontend
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  sqlite_data:
