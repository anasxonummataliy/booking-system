version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: healthplus_postgres
    restart: always
    environment:
      POSTGRES_USER: healthplus_user
      POSTGRES_PASSWORD: healthplus_secure_password
      POSTGRES_DB: healthplus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthplus_user -d healthplus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: healthplus_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://healthplus_user:healthplus_secure_password@db:5432/healthplus_db
      SECRET_KEY: super-secret-healthplus-jwt-key-2026-production-ready
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthplus_frontend
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  postgres_data:
